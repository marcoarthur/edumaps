conexoes:
  - "Escola nos censos: unir clean.censo_escolas com clean.censo_matriculas/censo_docentes/censo_gestor/school_indicators por co_entidade E nu_ano_censo."
  - "Escola nas avaliações: clean.ideb_notas_escolas, clean.inep, clean.inep_notas_desagregadas e clean.inse usam id_escola, que é o mesmo código INEP = co_entidade do censo."
  - "Município: filtrar/agregar por co_municipio (código IBGE 7 dígitos) presente em censo_escolas, ideb_notas_escolas, inse e school_indicators; no_municipio para rótulos."
  - "Consolidado municipal: analytics.mv_municipios_consolidado e analytics.mv_rede_escolas por co_municipio; use-os para comparar municípios/UF sem joins pesados."
  - "Demografia/PIB: clean.populacao_municipal e clean.dados_ibge por codigo_ibge; clean.municipios_sp tem geometria e nomes regionais (SP)."
  - "Remuneração: clean.remuneracao_municipal por cod_municipio (6 dígitos, formato antigo) e ano/mês; SEMPRE agregar por categoria/rede; nunca expor o profissional."
  - "Quando a pergunta pedir indicador já calculado (licenciatura, efetivos, nota média, IDEB, cluster), preferir clean.school_indicators."

termos:
  libras:
    descricao: "Educação/atendimento em Libras (alunos surdos)"
    colunas:
      - "clean.censo_matriculas.qt_mat_bas_libras (matrículas com Libras)"
      - "clean.censo_escolas.qt_prof_trad_libras (tradutores/intérpretes)"
      - "clean.censo_escolas.in_material_ped_bil_surdos (materiais bilíngues)"
      - "clean.censo_docentes.qt_doc_bas_libras (docentes com proficiência)"
      - "clean.censo_docentes.qt_doc_bas_tradutor_libras (docentes intérpretes)"
      - "clean.censo_docentes.qt_doc_bas_disc_libras (docentes que lecionam Libras)"
      - "clean.censo_docentes.qt_doc_bas_espec_bil_surdos (docentes com especialização bilíngue)"
  acessibilidade:
    descricao: "Infraestrutura acessível na escola (PcD)"
    colunas:
      - "clean.censo_escolas.in_acessibilidade_rampas"
      - "clean.censo_escolas.in_acessibilidade_elevador"
      - "clean.censo_escolas.in_acessibilidade_corrimao"
      - "clean.censo_escolas.in_acessibilidade_pisos_tateis"
      - "clean.censo_escolas.in_acessibilidade_sinal_visual (sinalização visual/braille)"
      - "clean.censo_escolas.in_acessibilidade_sinal_sonoro"
      - "clean.censo_escolas.in_acessibilidade_sinal_tatil"
      - "clean.censo_escolas.in_banheiro_pne (banheiro acessível)"
      - "clean.censo_escolas.in_acessibilidade_inexistente (sem recursos de acessibilidade)"
  educacao_especial:
    descricao: "Educação especial/inclusiva e Atendimento Educacional Especializado (AEE)"
    colunas:
      - "clean.censo_matriculas.qt_mat_esp (matrículas na educação especial)"
      - "clean.censo_matriculas.qt_mat_esp_cc (inclusão em classes comuns)"
      - "clean.censo_matriculas.qt_mat_esp_ce (classes exclusivas/AEE)"
      - "clean.censo_escolas.tp_aee (tipo de AEE)"
      - "clean.censo_escolas.in_sala_atendimento_especial (sala de atendimento)"
      - "clean.censo_escolas.in_especial_exclusiva (educação especial exclusiva)"
      - "clean.censo_docentes.qt_doc_esp (docentes na educação especial)"
      - "clean.censo_escolas.qt_prof_revisor_braille"
  eja:
    descricao: "Educação de Jovens e Adultos"
    colunas:
      - "clean.censo_escolas.in_eja (oferta de EJA)"
      - "clean.censo_matriculas.qt_mat_eja / qt_mat_eja_fund / qt_mat_eja_med (matrículas EJA)"
      - "clean.censo_docentes.qt_doc_eja (docentes EJA)"
  transporte_escolar:
    descricao: "Transporte escolar / alunos atendidos"
    colunas:
      - "clean.censo_matriculas.qt_transp_publico (alunos com transporte público)"
      - "clean.censo_matriculas.qt_transp_resp_mun (responsabilidade municipal)"
      - "clean.censo_matriculas.qt_transp_resp_est (responsabilidade estadual)"
  rural:
    descricao: "Escolas/matrículas em área rural"
    colunas:
      - "clean.censo_escolas.tp_localizacao (1=Urbana, 2=Rural)"
      - "clean.censo_matriculas.qt_mat_zr_rur (matrículas em zona rural)"
      - "clean.censo_matriculas.qt_mat_zr_urb (matrículas em zona urbana)"
  cor_raca:
    descricao: "Composição por raça/cor de alunos e docentes"
    colunas:
      - "clean.censo_matriculas.qt_mat_bas_branca/preta/parda/amarela/indigena (alunos)"
      - "clean.censo_docentes.qt_doc_bas_branca/preta/parda/amarela/indigena (docentes)"
  sexo:
    descricao: "Composição por sexo de alunos, docentes e gestores"
    colunas:
      - "clean.censo_matriculas.qt_mat_bas_fem/masc (alunos)"
      - "clean.censo_docentes.qt_doc_bas_fem/masc (docentes)"
      - "clean.censo_gestor.qt_gest_bas_fem/masc (gestores)"
  tempo_integral:
    descricao: "Matrículas em tempo integral"
    colunas:
      - "clean.censo_matriculas.qt_mat_bas_int (total)"
      - "clean.censo_matriculas.qt_mat_inf_int / qt_mat_fund_int / qt_mat_med_int (por etapa)"
      - "clean.censo_escolas.tp_atividade_complementar"
  docencia_disciplina:
    descricao: "Docentes por disciplina lecionada"
    colunas:
      - "clean.censo_docentes.qt_doc_bas_disc_matematica/linguagem etc."
      - "clean.censo_docentes.qt_doc_bas_disc_libras (Libras)"
      - "clean.censo_docentes.qt_doc_bas_disc_lingua_indig (língua indígena)"
  formacao_docente:
    descricao: "Formação/escolaridade dos docentes"
    colunas:
      - "clean.censo_docentes.qt_doc_bas_esco_sup_grad (graduação)"
      - "clean.censo_docentes.qt_doc_bas_esco_sup_grad_licen (licenciatura)"
      - "clean.censo_docentes.qt_doc_bas_esco_sup_pos_mestra (mestrado)"
      - "clean.censo_docentes.qt_doc_bas_esco_sup_pos_douto (doutorado)"
      - "clean.school_indicators.prop_licenciatura / prop_mestrado / prop_doutorado / prop_efetivos"
  ideb:
    descricao: "IDEB e proficiência SAEB por escola"
    colunas:
      - "clean.ideb_notas_escolas.ideb_observado / ideb_projecao / nota_matematica / nota_portugues"
      - "clean.inep.vl_observado_* / vl_nota_media_* (série wide por ano)"
      - "clean.inep_notas_desagregadas.nota_mat / nota_por / nota_media (longa)"
      - "clean.school_indicators.ideb_observado / nota_media (média entre etapas)"
  inse:
    descricao: "Nível socioeconômico dos alunos (SAEB)"
    colunas:
      - "clean.inse.media_inse (0-10)"
      - "clean.inse.inse_classificacao (Níveis I-VIII)"
      - "clean.inse.pc_nivel_1 .. pc_nivel_8 (percentuais por nível)"
  remuneracao:
    descricao: "Salário dos profissionais da educação (SIOPE) - sempre agregar"
    colunas:
      - "clean.remuneracao_municipal.categoria / tipo / rede / situacao / segmento_ensino"
      - "clean.remuneracao_municipal.salario_base / salario_fundeb_min / salario_fundeb_max / salario_total"
      - "clean.remuneracao_municipal.carga_horaria"
  pcd:
    descricao: "Alunos/docentes com deficiência"
    colunas:
      - "clean.censo_matriculas.qt_mat_esp (deficiência/TEA/superdotação no censo)"
      - "clean.censo_docentes.qt_doc_bas_pcd (docentes com deficiência)"
      - "clean.censo_escolas.in_reserva_pcd (reserva de vagas para PcD)"
  creche_e_infantil:
    descricao: "Educação infantil (creche e pré-escola)"
    colunas:
      - "clean.censo_escolas.in_comum_creche / in_comum_pre"
      - "clean.censo_matriculas.qt_mat_inf_cre / qt_mat_inf_pre"
      - "clean.censo_docentes.qt_doc_inf_cre / qt_doc_inf_pre"

