# Dicionário do Assistente do Censo
#
# Glossário curado para o tradutor NL->SQL do chat do gestor. Autores do
# domínio (gestão municipal / rede) traduzem o vocabulário educacional para
# colunas das tabelas do Censo Escolar e indicadores do EduMaps.
#
# NÃO aparecem aqui tabelas sensíveis ou internas (gestores, sessoes,
# contatos, relacoes, inventario, gestor_pesquisas, minion, event_store).
# A whitelist de tabelas expostas ao modelo vive neste arquivo.
#
# - `colunas` especifica, por tabela, as colunas relevantes e suas
#   descrições. "colunas: '*' significa todas as colunas da tabela (com
#   comentário extraído do banco). Tabelas com '*' ficam de fora quando a
#   carga completa for grande demais para o prompt.
# - `ocultar` lista padrões de nome de coluna que NUNCA voltam na resposta
#   (PII): colunas que casem são removidas do resultado antes de entregar.
# - `conexoes` orienta joins entre tabelas (os elos do schema).
# - `termos` mapeia vocabulário educacional comum para colunas concretas.
# - `codificacoes` documenta enums (tp_*) usados nas tabelas.

tabelas:
  clean.censo_escolas:
    descricao: "Escolas do Censo Escolar (uma linha por escola/ano). Identidade, localização, infraestrutura, recursos, oferta de etapas/modalidades e perfil de profissionais."
    chave: co_entidade
  clean.censo_matriculas:
    descricao: "Matrículas do Censo Escolar por escola/ano, detalhadas por etapa do censo (infantil, fundamental, médio, EJA, especial, profissional), sexo, cor/raça, faixa etária, turno e transporte escolar."
    chave: co_entidade
  clean.censo_docentes:
    descricao: "Docentes do Censo Escolar por escola/ano: quantidade por etapa, formação/escolaridade, vínculo, disciplinas lecionadas e especializações (incluindo Libras)."
    chave: co_entidade
  clean.censo_gestor:
    descricao: "Gestores escolares do Censo Escolar por escola/ano: perfil (sexo, idade, cor/raça), escolaridade, vínculo, critério de acesso ao cargo e formação continuada."
    chave: co_entidade
  clean.ideb_notas_escolas:
    descricao: "IDEB/SAEB por escola/ano/etapa (formato longo). Inclui aprovação, notas de proficiência (matemática/português) e IDEB observado/projetado."
    chave: id_escola
  clean.inep:
    descricao: "Série histórica wide (2005-2023) dos indicadores INEP por escola: fluxo, notas e IDEB observado/projetado. Colunas seguem o padrão vl_nota_matematica_<ano>, vl_nota_portugues_<ano>, vl_nota_media_<ano>, vl_observado_<ano>, vl_projecao_<ano>, vl_aprovacao_<ano>_1..4; os anos pares não existem (aplicações ímpares)."
    chave: id_escola
  clean.inep_notas_desagregadas:
    descricao: "Notas SAEB/Prova Brasil (matemática, português, média) por escola/ano, formato longo 2005-2023."
    chave: id_escola
  clean.inse:
    descricao: "Índice de Nível Socioeconômico (INSE, SAEB 2023) por escola: média 0-10, classificação Nível I-VIII e percentuais de alunos por nível."
    chave: id_escola
  clean.school_indicators:
    descricao: "Espelho de censo_escolas com indicadores calculados: proporções de docência (licenciatura, mestrado, efetivos), nota SAEB/IDEB médios, nº de etapas, cluster. Preferir aqui quando a pergunta pede indicador já calculado."
    chave: co_entidade
  clean.remuneracao_municipal:
    descricao: "Remuneração mensal de profissionais da educação do município (SIOPE, por profissional/ano/mês). SEMPRE agregar (categoria, rede, cargo); nunca retornar linhas individuais."
    chave: cod_municipio
  clean.populacao_municipal:
    descricao: "População estimada por município (IBGE) com faixas etárias e totais consolidados."
    chave: codigo_ibge
  clean.dados_ibge:
    descricao: "PIB municipal (SIDRA/IBGE): total e valor adicionado por setor com participações percentuais."
    chave: codigo_ibge
  analytics.mv_municipios_consolidado:
    descricao: "Visão consolidada por município: dados educacionais, IDEB/SAEB, demografia e PIB. Para perguntas comparando municípios/UF."
    chave: co_municipio
  analytics.mv_rede_escolas:
    descricao: "Rede de escolas por município e dependência administrativa (federal, estadual, municipal, privada): matrículas, docentes, etapas e desempenho."
    chave: co_municipio

