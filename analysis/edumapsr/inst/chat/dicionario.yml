  - "email"
  - "senha"
  - "token"
  - "nu_telefone"
  - "^ds_endereco"
  - "^nu_endereco"
  - "co_cep"

codificacoes:
  tp_dependencia: "1=Federal, 2=Estadual, 3=Municipal, 4=Privada"
  tp_categoria_escola_privada: "1=Particular, 2=Comunitária, 3=Confessional, 4=Filantrópica"
  tp_localizacao: "1=Urbana, 2=Rural"
  tp_situacao_funcionamento: "1=Ativa, 2=Paralisada, 3=Extinta"
  tp_aee: "1=Sala multifuncional, 2=Outras salas, 3=Canto de atividades, 4=Itinerância, 5=Classe hospitalar, 8=Não se aplica"
  rede_texto: "ideb/inep: Municipal, Estadual, Federal, Privada. inep_notas: Pública Municipal, Pública Estadual, Pública Federal, Privada. inse (tp_tipo_rede): 1=Federal, 2=Estadual, 3=Municipal, 4=Privada."
  in_indicadores: "Todas as colunas prefixadas com 'in_' são binárias: 0=Não, 1=Sim."
  etapa_ideb: "clean.ideb_notas_escolas.etapa: fundamental_ii ou ensino_medio."
