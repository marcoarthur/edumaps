# Card do IVET — ficha do índice (#137, entregável 5).
# Legível por máquina; testado contra a implementação em
# tests/testthat/test-ivet-card.R (o card não pode divergir do código).
card: ivet
formula: ivet-v1.2
leitura: territorial
unidade: escola como ponto de observacao em contexto territorial
direcao: maior = mais vulneravel
escala: [0, 1]

blocos:
  escola: A
  socioeconomico: B
  mobilidade: C
  saude: D
  seguranca: E
  meio_ambiente: F
  recursos: G

# Enquanto faltar algum bloco territorial minimo, o IVET agregado sai NA e
# publica-se so o bloco escola (§4.3).
blocos_territoriais_minimos: [mobilidade, saude, seguranca]

pesos:
  regra: peso igual entre as dimensoes disponiveis (W=1)
  dimensao_ausente: fica fora do numerador e do denominador (nao penaliza)
  componente_ausente: vira 0 dentro da dimensao

bloco_b:
  # Default da formula ivet-v1.2: instrucao + renda do responsavel + saneamento.
  default: [analfabetismo, renda, saneamento]
  componentes:
    analfabetismo:
      fonte: clean.escola_entorno_socioeconomico.pct_analfabeto
      normalizacao: proporcao
      direcao: "+"
      no_default: false
    renda:
      fonte: clean.escola_entorno_socioeconomico.renda_resp_media
      normalizacao: "1 - clamp(renda/teto)"
      direcao: "+"
      no_default: false
      teto: 2424
      teto_nota: "2 salarios minimos jul/2022; renda do RESPONSAVEL, nao per capita"
    saneamento:
      normalizacao: "media dos subcomponentes disponiveis (ivet_agregar, NA fora)"
      direcao: "+"
      no_default: false
      subcomponentes: [agua_sem_rede, esgoto_inadequado, lixo_inadequado, sem_banheiro]
    agua_sem_rede:
      fonte: clean.escola_entorno_socioeconomico.pct_agua_sem_rede
      normalizacao: proporcao
      direcao: "+"
      no_default: false
    esgoto_inadequado:
      fonte: clean.escola_entorno_socioeconomico.pct_esgoto_inadequado
      normalizacao: proporcao
      direcao: "+"
      no_default: false
    lixo_inadequado:
      fonte: clean.escola_entorno_socioeconomico.pct_lixo_inadequado
      normalizacao: proporcao
      direcao: "+"
      no_default: false
    sem_banheiro:
      fonte: clean.escola_entorno_socioeconomico.pct_sem_banheiro
      normalizacao: proporcao
      direcao: "+"
      no_default: false
    sem_instrucao:
      fonte: null
      normalizacao: proporcao
      direcao: "+"
      no_default: true
      nota: "sem fonte por setor no Censo 2022 (#238)"
    fund_incomp:
      fonte: null
      normalizacao: proporcao
      direcao: "+"
      no_default: true
      nota: "sem fonte por setor no Censo 2022 (#238)"
    preto_pardo:
      fonte: null
      normalizacao: proporcao
      direcao: "+"
      no_default: true
      nota: "leitura de equidade; exige justificativa para publicar"

proveniencia:
  dataset_version: "pin da entrada raw (data_pipeline/datasets.lock.json, #135)"
  transform_version: "pin do codigo raw->clean->analytics (data_pipeline/datasets.lock.json, #135)"
  vigencia: "ivet_vigencia(): vigente se dataset_version, transform_version e formula conferem com o lockfile"

validacao:
  testes: [tests/testthat/test-ivet.R, tests/testthat/test-ivet-socioeconomico.R, tests/testthat/test-ivet-card.R]
