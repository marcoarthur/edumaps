# Card do IVET — ficha do índice (#137, entregável 5).
# Legível por máquina; testado contra a implementação em
# tests/testthat/test-ivet-card.R (o card não pode divergir do código).
card: ivet
formula: ivet-v1.2
leitura: territorial
unidade: escola como ponto de observacao em contexto territorial
direcao: maior = mais vulneravel
escala: [0, 1]

blocos:
  escola: A
  socioeconomico: B
  mobilidade: C
  saude: D
  seguranca: E
  meio_ambiente: F
  recursos: G

# Enquanto faltar algum bloco territorial minimo, o IVET agregado sai NA e
# publica-se so o bloco escola (§4.3).
blocos_territoriais_minimos: [mobilidade, saude, seguranca]

pesos:
  regra: peso igual entre as dimensoes disponiveis (W=1)
  dimensao_ausente: fica fora do numerador e do denominador (nao penaliza)
  componente_ausente: fica fora do denominador da dimensao (NA, #154) — nunca 0

bloco_a:
  # Reconciliacao B<->C (#137, fatia C): B e o sistema canonico; C e a camada de
  # analise e entra so como refinamento opcional (*_c), fora do default.
  fonte: clean.mv_escolas_scores
  escala_fonte: "0-10 (maior = melhor)"
  normalizacao: "1 - clamp(score/10)"
  direcao: "+"
  default: [capacidade_atendimento, infraestrutura, capacitacao_docente, diversidade_discente, capacidade_gestora, sustentabilidade]
  sistema_c:
    nota: "camada de analise (EduMaps::Model::Indicator::School::*), 0-1; entra so por escolha"
    normalizacao: "1 - clamp(indicador)"
  componentes:
    capacidade_atendimento:
      fonte: score_capacidade_atendimento
      sistema: B
      no_default: false
    infraestrutura:
      fonte: score_infraestrutura
      sistema: B
      no_default: false
    capacitacao_docente:
      fonte: score_capacitacao_docente
      sistema: B
      no_default: false
    diversidade_discente:
      fonte: score_diversidade_discente
      sistema: B
      no_default: false
    capacidade_gestora:
      fonte: score_capacidade_gestora
      sistema: B
      no_default: false
    sustentabilidade:
      fonte: score_sustentabilidade
      sistema: B
      no_default: false
    acessibilidade_c:
      fonte: iai
      sistema: C
      no_default: true
    tecnologia_c:
      fonte: itd
      sistema: C
      no_default: true
    oferta_c:
      fonte: ioc
      sistema: C
      no_default: true
    qualificacao_docente_c:
      fonte: iqd
      sistema: C
      no_default: true
      nota: "clampado (viola [0,1] no sistema C)"

bloco_b:
  # Default da formula ivet-v1.2: instrucao + renda do responsavel + saneamento.
  default: [analfabetismo, renda, saneamento]
  componentes:
    analfabetismo:
      fonte: clean.escola_entorno_socioeconomico.pct_analfabeto
      normalizacao: proporcao
      direcao: "+"
      no_default: false
    renda:
      fonte: clean.escola_entorno_socioeconomico.renda_resp_media
      normalizacao: "1 - clamp(renda/teto)"
      direcao: "+"
      no_default: false
      teto: 2424
      teto_nota: "2 salarios minimos jul/2022; renda do RESPONSAVEL, nao per capita"
    saneamento:
      normalizacao: "media dos subcomponentes disponiveis (ivet_agregar, NA fora)"
      direcao: "+"
      no_default: false
      subcomponentes: [agua_sem_rede, esgoto_inadequado, lixo_inadequado, sem_banheiro]
    agua_sem_rede:
      fonte: clean.escola_entorno_socioeconomico.pct_agua_sem_rede
      normalizacao: proporcao
      direcao: "+"
      no_default: false
    esgoto_inadequado:
      fonte: clean.escola_entorno_socioeconomico.pct_esgoto_inadequado
      normalizacao: proporcao
      direcao: "+"
      no_default: false
    lixo_inadequado:
      fonte: clean.escola_entorno_socioeconomico.pct_lixo_inadequado
      normalizacao: proporcao
      direcao: "+"
      no_default: false
    sem_banheiro:
      fonte: clean.escola_entorno_socioeconomico.pct_sem_banheiro
      normalizacao: proporcao
      direcao: "+"
      no_default: false
    sem_instrucao:
      fonte: null
      normalizacao: proporcao
      direcao: "+"
      no_default: true
      nota: "sem fonte por setor no Censo 2022 (#238)"
    fund_incomp:
      fonte: null
      normalizacao: proporcao
      direcao: "+"
      no_default: true
      nota: "sem fonte por setor no Censo 2022 (#238)"
    preto_pardo:
      fonte: null
      normalizacao: proporcao
      direcao: "+"
      no_default: true
      nota: "leitura de equidade; exige justificativa para publicar"

bloco_c:
  # Acesso/mobilidade. A dimensao central de C e o acesso (isocrona); ele entrou
  # por fases (#278): o piloto do ES carregou clean.isocrona_escolar (Valhalla
  # auto-hospedado) e os componentes acesso_isocrona (15 min a pe) e
  # acesso_auto_45min (45 min de carro) entraram no default. Fora do piloto os
  # componentes sao NA (#154) e C segue lido como EXPOSICAO VIARIA — o que a
  # fonte municipal entrega: sinistros RENAEST + frota RENAVAM.
  fonte: analytics.mobilidade_escola + clean.isocrona_escolar
  denominador: clean.populacao_municipal
  default: [risco_sinistros, exposicao_frota, acesso_isocrona, acesso_auto_45min]
  nao_usados:
    antt_od: "clean.antt_od_municipio VAZIA (MONITRIIP, grao de viagem individual/LGPD)"
    vmda: "clean.snv_trecho_vmda VAZIA (DNIT, nao ingerido)"
    sinistros_fatais_12m: "0 em todas as escolas-municipio do dev (constante; nao entra)"
  componentes:
    risco_sinistros:
      fonte: analytics.mobilidade_escola.sinistros_12m
      normalizacao: "clamp(taxa100k/500)"
      direcao: "+"
      no_default: false
      teto: 500
      teto_nota: "sinistros por 100 mil hab (RENAEST); p50=60, p90=429, p99=988"
    exposicao_frota:
      fonte: analytics.mobilidade_escola.renavam_total_frota
      normalizacao: "clamp((frota/populacao)/1)"
      direcao: "+"
      no_default: false
      teto: 1
      teto_nota: "veiculos por habitante (RENAVAM); p90=0,89; proxy de densidade de trafego, nao de acesso"
    acesso_isocrona:
      fonte: clean.isocrona_escolar.populacao_grade
      normalizacao: "1 - clamp((soma 15min a pe)/teto)"
      direcao: "-"
      no_default: false
      teto: 65000
      teto_nota: "populacao alcancavel a pe em 15 min (H3 r9); recalibrado na rodada 2 SP+RJ+NE (#295, 81.925 escolas, 2026-10-23: p50=7201, p90=35229, p99=61349)"
      cobertura: "expansao nacional SP+RJ+NE (81.926 escolas); fora dela NA (#154), nao zera"
    acesso_auto_45min:
      fonte: clean.isocrona_escolar.populacao_grade
      normalizacao: "1 - clamp((soma 45min de carro)/teto)"
      direcao: "-"
      no_default: false
      teto: 20000000
      teto_nota: "populacao regional alcancavel em 45 min de carro (H3 r7, costing auto do Valhalla); recalibrado na rodada 2 SP+RJ+NE (#295, 81.925 escolas, 2026-10-23: p50=520572, p90=12400728, p99=19486927; era 5.000.000 na expansao ES+MG)"
      cobertura: "expansao nacional SP+RJ+NE (81.926 escolas); fora dela NA (#154), nao zera"
      vies_nota: "viés de fronteira residual na borda MG<->BA, minimizado pela cobertura ampliada"

bloco_d:
  # Atencao basica de saude (CNES + SISAB/PMMB). Distancia da escola a UBS
  # (grao escola) + provisao municipal (equipes por 10 mil hab). A coluna
  # cobertura_aps da tabela e POPULACAO do PMMB (pessoas), nao cobertura; aqui
  # usa-se a razao de equipes. categoria_ivs (vulnerabilidade social do MS) nao
  # entra (duplica o bloco B, nao mede acesso).
  fonte: analytics.acessibilidade_saude
  denominador: clean.populacao_municipal
  default: [distancia_ubs, cobertura_aps]
  nao_usados:
    categoria_ivs: "categoria de vulnerabilidade social do MS; duplica o bloco B, nao mede acesso"
  componentes:
    distancia_ubs:
      fonte: analytics.acessibilidade_saude.dist_min_km_ubs
      normalizacao: "clamp(dist/5)"
      direcao: "+"
      no_default: false
      teto: 5
      teto_nota: "km; limiar 'acesso dificil (>5km)' da propria view (13,4% das escolas); p90 = 7,25. Sem limiar numerico na literatura - decisao de produto (ivet-coeficientes.md secao 5)"
    cobertura_aps:
      fonte: "analytics.acessibilidade_saude.(equipe_esf + ativas_ff) / populacao"
      normalizacao: "1 - clamp(taxa10k/8)"
      direcao: "+"
      no_default: false
      teto: 8
      teto_nota: "equipes de atencao basica por 10 mil hab; p50 = 3,30, p90 = 8,39. Lastro: PNAB (Portaria 2.436/2017; Port. Cons. 2/2017 Anexo XXII) = 1 equipe por 2.000-3.500 pessoas (media 3.000; max 4.000) -> 2,86-5,0/10 mil; o p50 medido cai na media normativa, e o teto 8 (= p90) e leitura relativa, acima da faixa normativa. Escolha em aberto (8 x 5) - ivet-coeficientes.md secao 5"
    presenca_ubs:
      fonte: analytics.acessibilidade_saude.n_ubs_municipio
      normalizacao: "1 - clamp(taxa10k/8)"
      direcao: "+"
      no_default: true
      teto: 8
      teto_nota: "UBS por 10 mil hab; p90 = 8,45; redundante com cobertura_aps (corr 0,78)"
    efetividade_vagas_aps:
      fonte: analytics.acessibilidade_saude.efetividade_vagas_aps
      normalizacao: "1 - clamp(x/100)"
      direcao: "+"
      no_default: true
      teto: 100
      teto_nota: "% de ocupacao das vagas do PMMB; p50 = 98,8 (quase saturada)"

bloco_e:
  # Seguranca publica (BrazilCrime/SINESP). Taxa por 100 mil habitantes,
  # normalizada por teto; celula suprimida (1..4) vira NA, nunca 0 (#154).
  fonte: clean.brazilcrime_municipio
  denominador: clean.populacao_municipal
  unidade: taxa por 100 mil habitantes
  default: [homicidio_doloso, latrocinio, lesao_corporal_seguida_de_morte]
  componentes:
    homicidio_doloso:
      fonte: clean.brazilcrime_municipio.homicidio_doloso
      normalizacao: "clamp(taxa/50)"
      direcao: "+"
      no_default: false
      teto: 50
      teto_nota: "por 100 mil habitantes; p50 municipal ~0, p90 = 46,3 (media 2021-23). Lastro: OMS/PAHO (>10 = violencia epidemica) e Atlas da Violencia 2026 (Ipea/FBSP, 2024: referencia nacional 23,4; 46 municipios > 40). Teto 50 = p90 = ~2x a referencia nacional; escolha em aberto (50 x 40 x 25) - ivet-coeficientes.md secao 5"
    latrocinio:
      fonte: clean.brazilcrime_municipio.latrocinio
      normalizacao: "clamp(taxa/5)"
      direcao: "+"
      no_default: false
      teto: 5
      teto_nota: "por 100 mil habitantes; evento raro (p90 = 0)"
    lesao_corporal_seguida_de_morte:
      fonte: clean.brazilcrime_municipio.lesao_corporal_seguida_de_morte
      normalizacao: "clamp(taxa/5)"
      direcao: "+"
      no_default: false
      teto: 5
      teto_nota: "por 100 mil habitantes; evento raro (p90 = 0)"

bloco_f:
  # Meio ambiente (MapBiomas). Duas metades extraidas: cobertura do solo
  # (#255, clean.v_mapbiomas_escola_grupos: vegetacao natural) e exposicao a
  # risco (#278, clean.mapbiomas_escola_risco: fogo + carbono do solo).
  # Direcao: maior = mais vulneravel — o FOGO entra direto; a VEGETACAO e o
  # CARBONO entram invertidos (1 - clamp), como a renda do bloco B.
  # Pesos iguais entre os componentes disponiveis.
  # ATENCAO: a cobertura do solo hoje so cobre o ES (ano 2024, 2.967 escolas) e
  # a exposicao a risco cobre o PAIS (ano 2020, 156.816 escolas, pendentes = 0);
  # onde um componente falta ele cai fora do denominador (#154), e o bloco
  # degrada para fogo+solo. Tetos de fogo e carbono CALIBRADOS no p99 nacional
  # (ivet-coeficientes.md secao 5).
  fonte: clean.mapbiomas_escola_risco
  default: [risco_fogo, vegetacao_natural, carbono_solo]
  componentes:
    risco_fogo:
      fonte: clean.mapbiomas_escola_risco.fogo_frequencia_media
      normalizacao: "clamp(freq/teto)"
      direcao: "+"
      no_default: false
      teto: 2.463
      teto_nota: "frequencia media de fogo 1985-2020 (MapBiomas Fogo); nacional p50=0,006, p90=0,320, p99=2,463 (max 16,345); teto = p99 nacional"
    vegetacao_natural:
      fonte: "clean.v_mapbiomas_escola_grupos.fracao (grupo vegetacao_natural)"
      normalizacao: "1 - clamp(fracao)"
      direcao: "+"
      no_default: false
      teto_nota: "fracao da area de influencia (MapBiomas Colecao 11); sem teto (proporcao); ES p50=0,104, p90=0,356"
    carbono_solo:
      fonte: clean.mapbiomas_escola_risco.solo_carbono_medio
      normalizacao: "1 - clamp(carbono/teto)"
      direcao: "+"
      no_default: false
      teto: 705.98
      teto_nota: "carbono organico do solo (tC/ha, MapBiomas); nacional p50=233,6, p90=485,7, p99=705,98 (max 2.833,8); teto = p99 nacional; varia por bioma; bruto negativo (nodata) satura em 1"

bloco_g:
  # Recursos fiscais (SIOPE/SICONFI). Indicadores "maior = melhor", invertidos
  # para a direcao do IVET (1 - clamp(valor/teto)). pct_receita_em_educ esta
  # corrompido na tabela e nao entra.
  fonte: analytics.esforco_fiscal_educacao
  default: [fundeb_por_aluno, despesa_educ_por_aluno, autonomia_fiscal_pct]
  nao_usados:
    pct_receita_em_educ: "corrompido na tabela (valores fora de [0,100]); nao entra"
  componentes:
    fundeb_por_aluno:
      fonte: analytics.esforco_fiscal_educacao.fundeb_por_aluno
      normalizacao: "1 - clamp(x/10000)"
      direcao: "+"
      no_default: false
      teto: 10000
      teto_nota: "R$/aluno/ano; p90 municipal ~9336"
    despesa_educ_por_aluno:
      fonte: analytics.esforco_fiscal_educacao.despesa_educ_por_aluno
      normalizacao: "1 - clamp(x/15000)"
      direcao: "+"
      no_default: false
      teto: 15000
      teto_nota: "R$/aluno/ano; p90 municipal ~14521"
    autonomia_fiscal_pct:
      fonte: analytics.esforco_fiscal_educacao.autonomia_fiscal_pct
      normalizacao: "1 - clamp(x/50)"
      direcao: "+"
      no_default: false
      teto: 50
      teto_nota: "%; p90 municipal ~30,9"

proveniencia:
  dataset_version: "pin da entrada raw (data_pipeline/datasets.lock.json, #135)"
  transform_version: "pin do codigo raw->clean->analytics (data_pipeline/datasets.lock.json, #135)"
  vigencia: "ivet_vigencia(): vigente se dataset_version, transform_version e formula conferem com o lockfile"

validacao:
  testes: [tests/testthat/test-ivet.R, tests/testthat/test-ivet-socioeconomico.R, tests/testthat/test-ivet-escola.R, tests/testthat/test-ivet-seguranca.R, tests/testthat/test-ivet-recursos.R, tests/testthat/test-ivet-saude.R, tests/testthat/test-ivet-mobilidade.R, tests/testthat/test-ivet-meio-ambiente.R, tests/testthat/test-ivet-card.R]
