# Card do IVET — ficha do índice (#137, entregável 5).
# Legível por máquina; testado contra a implementação em
# tests/testthat/test-ivet-card.R (o card não pode divergir do código).
card: ivet
formula: ivet-v1.2
leitura: territorial
unidade: escola como ponto de observacao em contexto territorial
direcao: maior = mais vulneravel
escala: [0, 1]

blocos:
  escola: A
  socioeconomico: B
  mobilidade: C
  saude: D
  seguranca: E
  meio_ambiente: F
  recursos: G

# Enquanto faltar algum bloco territorial minimo, o IVET agregado sai NA e
# publica-se so o bloco escola (§4.3).
blocos_territoriais_minimos: [mobilidade, saude, seguranca]

pesos:
  regra: peso igual entre as dimensoes disponiveis (W=1)
  dimensao_ausente: fica fora do numerador e do denominador (nao penaliza)
  componente_ausente: vira 0 dentro da dimensao

bloco_a:
  # Reconciliacao B<->C (#137, fatia C): B e o sistema canonico; C e a camada de
  # analise e entra so como refinamento opcional (*_c), fora do default.
  fonte: clean.mv_escolas_scores
  escala_fonte: "0-10 (maior = melhor)"
  normalizacao: "1 - clamp(score/10)"
  direcao: "+"
  default: [capacidade_atendimento, infraestrutura, capacitacao_docente, diversidade_discente, capacidade_gestora, sustentabilidade]
  sistema_c:
    nota: "camada de analise (EduMaps::Model::Indicator::School::*), 0-1; entra so por escolha"
    normalizacao: "1 - clamp(indicador)"
  componentes:
    capacidade_atendimento:
      fonte: score_capacidade_atendimento
      sistema: B
      no_default: false
    infraestrutura:
      fonte: score_infraestrutura
      sistema: B
      no_default: false
    capacitacao_docente:
      fonte: score_capacitacao_docente
      sistema: B
      no_default: false
    diversidade_discente:
      fonte: score_diversidade_discente
      sistema: B
      no_default: false
    capacidade_gestora:
      fonte: score_capacidade_gestora
      sistema: B
      no_default: false
    sustentabilidade:
      fonte: score_sustentabilidade
      sistema: B
      no_default: false
    acessibilidade_c:
      fonte: iai
      sistema: C
      no_default: true
    tecnologia_c:
      fonte: itd
      sistema: C
      no_default: true
    oferta_c:
      fonte: ioc
      sistema: C
      no_default: true
    qualificacao_docente_c:
      fonte: iqd
      sistema: C
      no_default: true
      nota: "clampado (viola [0,1] no sistema C)"

bloco_b:
  # Default da formula ivet-v1.2: instrucao + renda do responsavel + saneamento.
  default: [analfabetismo, renda, saneamento]
  componentes:
    analfabetismo:
      fonte: clean.escola_entorno_socioeconomico.pct_analfabeto
      normalizacao: proporcao
      direcao: "+"
      no_default: false
    renda:
      fonte: clean.escola_entorno_socioeconomico.renda_resp_media
      normalizacao: "1 - clamp(renda/teto)"
      direcao: "+"
      no_default: false
      teto: 2424
      teto_nota: "2 salarios minimos jul/2022; renda do RESPONSAVEL, nao per capita"
    saneamento:
      normalizacao: "media dos subcomponentes disponiveis (ivet_agregar, NA fora)"
      direcao: "+"
      no_default: false
      subcomponentes: [agua_sem_rede, esgoto_inadequado, lixo_inadequado, sem_banheiro]
    agua_sem_rede:
      fonte: clean.escola_entorno_socioeconomico.pct_agua_sem_rede
      normalizacao: proporcao
      direcao: "+"
      no_default: false
    esgoto_inadequado:
      fonte: clean.escola_entorno_socioeconomico.pct_esgoto_inadequado
      normalizacao: proporcao
      direcao: "+"
      no_default: false
    lixo_inadequado:
      fonte: clean.escola_entorno_socioeconomico.pct_lixo_inadequado
      normalizacao: proporcao
      direcao: "+"
      no_default: false
    sem_banheiro:
      fonte: clean.escola_entorno_socioeconomico.pct_sem_banheiro
      normalizacao: proporcao
      direcao: "+"
      no_default: false
    sem_instrucao:
      fonte: null
      normalizacao: proporcao
      direcao: "+"
      no_default: true
      nota: "sem fonte por setor no Censo 2022 (#238)"
    fund_incomp:
      fonte: null
      normalizacao: proporcao
      direcao: "+"
      no_default: true
      nota: "sem fonte por setor no Censo 2022 (#238)"
    preto_pardo:
      fonte: null
      normalizacao: proporcao
      direcao: "+"
      no_default: true
      nota: "leitura de equidade; exige justificativa para publicar"

bloco_e:
  # Seguranca publica (BrazilCrime/SINESP). Taxa por 100 mil habitantes,
  # normalizada por teto; celula suprimida (1..4) vira NA, nunca 0 (#154).
  fonte: clean.brazilcrime_municipio
  denominador: clean.populacao_municipal
  unidade: taxa por 100 mil habitantes
  default: [homicidio_doloso, latrocinio, lesao_corporal_seguida_de_morte]
  componentes:
    homicidio_doloso:
      fonte: clean.brazilcrime_municipio.homicidio_doloso
      normalizacao: "clamp(taxa/50)"
      direcao: "+"
      no_default: false
      teto: 50
      teto_nota: "por 100 mil habitantes; p90 municipal ~46"
    latrocinio:
      fonte: clean.brazilcrime_municipio.latrocinio
      normalizacao: "clamp(taxa/5)"
      direcao: "+"
      no_default: false
      teto: 5
      teto_nota: "por 100 mil habitantes; evento raro (p90 = 0)"
    lesao_corporal_seguida_de_morte:
      fonte: clean.brazilcrime_municipio.lesao_corporal_seguida_de_morte
      normalizacao: "clamp(taxa/5)"
      direcao: "+"
      no_default: false
      teto: 5
      teto_nota: "por 100 mil habitantes; evento raro (p90 = 0)"

bloco_g:
  # Recursos fiscais (SIOPE/SICONFI). Indicadores "maior = melhor", invertidos
  # para a direcao do IVET (1 - clamp(valor/teto)). pct_receita_em_educ esta
  # corrompido na tabela e nao entra.
  fonte: analytics.esforco_fiscal_educacao
  default: [fundeb_por_aluno, despesa_educ_por_aluno, autonomia_fiscal_pct]
  nao_usados:
    pct_receita_em_educ: "corrompido na tabela (valores fora de [0,100]); nao entra"
  componentes:
    fundeb_por_aluno:
      fonte: analytics.esforco_fiscal_educacao.fundeb_por_aluno
      normalizacao: "1 - clamp(x/10000)"
      direcao: "+"
      no_default: false
      teto: 10000
      teto_nota: "R$/aluno/ano; p90 municipal ~9336"
    despesa_educ_por_aluno:
      fonte: analytics.esforco_fiscal_educacao.despesa_educ_por_aluno
      normalizacao: "1 - clamp(x/15000)"
      direcao: "+"
      no_default: false
      teto: 15000
      teto_nota: "R$/aluno/ano; p90 municipal ~14521"
    autonomia_fiscal_pct:
      fonte: analytics.esforco_fiscal_educacao.autonomia_fiscal_pct
      normalizacao: "1 - clamp(x/50)"
      direcao: "+"
      no_default: false
      teto: 50
      teto_nota: "%; p90 municipal ~30,9"

proveniencia:
  dataset_version: "pin da entrada raw (data_pipeline/datasets.lock.json, #135)"
  transform_version: "pin do codigo raw->clean->analytics (data_pipeline/datasets.lock.json, #135)"
  vigencia: "ivet_vigencia(): vigente se dataset_version, transform_version e formula conferem com o lockfile"

validacao:
  testes: [tests/testthat/test-ivet.R, tests/testthat/test-ivet-socioeconomico.R, tests/testthat/test-ivet-escola.R, tests/testthat/test-ivet-seguranca.R, tests/testthat/test-ivet-recursos.R, tests/testthat/test-ivet-card.R]
