services:
  db:
    build: ./db
    container_name: edumaps-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Exposto só no loopback: os testes de backend rodam na máquina (prove -l)
    # e não há razão para o Postgres ficar acessível pela rede.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./datasets:/data

  sqitch:
    build: ./data_pipeline
    container_name: edumaps-sqitch
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=db
    command: deploy db:pg://${DB_USER}:${DB_PASS}@db/${DB_NAME}

  backend:
    build: ./backend
    container_name: edumaps-backend
    depends_on:
      sqitch:
        condition: service_completed_successfully
      analytic:
        condition: service_started
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=db
      - ANALYTICS_URL=http://analytic:8000
      - EDUMAPS_SENTRY_DSN=${EDUMAPS_SENTRY_DSN:-}
      - EDUMAPS_SENTRY_RELEASE=${EDUMAPS_SENTRY_RELEASE:-}
    ports:
      - "3000:3000"

  minion:
    build: ./backend
    container_name: edumaps-minion
    depends_on:
      - db
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=db
      - EDUMAPS_DB_URL=postgresql://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}
      - ANALYTICS_URL=http://analytic:8000
      - EDUMAPS_SENTRY_DSN=${EDUMAPS_SENTRY_DSN:-}
      - EDUMAPS_SENTRY_RELEASE=${EDUMAPS_SENTRY_RELEASE:-}
    # O ENTRYPOINT da imagem já é o docker-entrypoint.sh; passar o caminho de
    # novo aqui faria $1 virar o próprio script e o container subiria o morbo
    # (web) em vez do worker. Use só o argumento esperado pelo entrypoint.
    command: ["minion"]

  analytic:
    build: ./analysis/edumapsr
    container_name: edumaps-analytic
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=db
      - EDUMAPS_R_PORT=8000
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: edumaps-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
      - analytic
