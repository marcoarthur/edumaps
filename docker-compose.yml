services:
  db:
    build: ./db
    container_name: edumaps-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Exposto só no loopback: os testes de backend rodam na máquina (prove -l)
    # e não há razão para o Postgres ficar acessível pela rede.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./datasets:/data

  sqitch:
    build: ./data_pipeline
    container_name: edumaps-sqitch
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=db
    command: deploy db:pg://${DB_USER}:${DB_PASS}@db/${DB_NAME}

  backend:
    build: ./backend
    container_name: edumaps-backend
    depends_on:
      sqitch:
        condition: service_completed_successfully
      analytic:
        condition: service_started
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=db
      - ANALYTICS_URL=http://analytic:8000
      - EDUMAPS_SENTRY_DSN=${EDUMAPS_SENTRY_DSN:-}
      - EDUMAPS_SENTRY_RELEASE=${EDUMAPS_SENTRY_RELEASE:-}
    # #231: os jobs de ingestão validam URLs contra o allowlist, e a imagem
    # (contexto ./backend) não contém data_pipeline/. O Allowlist.pm procura
    # ../data_pipeline/allowlist.yaml a partir de /opt/edumaps/backend.
    volumes:
      - ./data_pipeline/allowlist.yaml:/opt/edumaps/data_pipeline/allowlist.yaml:ro
    ports:
      # 3010 no host: a 3000 ficou com o WhatsApp bridge (~/.hermes) e os dois
      # não coexistem (decisão do developer, 2026-10-20). Internamente o
      # container continua em :3000 — o nginx do frontend usa `backend:3000`
      # pelo nome do serviço, sem impacto.
      - "3010:3000"

  minion:
    build: ./backend
    container_name: edumaps-minion
    depends_on:
      - db
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=db
      - EDUMAPS_DB_URL=postgresql://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}
      - ANALYTICS_URL=http://analytic:8000
      - EDUMAPS_SENTRY_DSN=${EDUMAPS_SENTRY_DSN:-}
      - EDUMAPS_SENTRY_RELEASE=${EDUMAPS_SENTRY_RELEASE:-}
    # #231: idem backend — allowlist dos jobs de ingestão (somente leitura).
    volumes:
      - ./data_pipeline/allowlist.yaml:/opt/edumaps/data_pipeline/allowlist.yaml:ro
      # #231/#156: arquivos brutos (ZIPs/CSVs) baixados pela ingestão, com
      # manifesto no import_metadata — fora do pgdata e fora do Git.
      - ./raw:/srv/edumaps/raw
    # O ENTRYPOINT da imagem já é o docker-entrypoint.sh; passar o caminho de
    # novo aqui faria $1 virar o próprio script e o container subiria o morbo
    # (web) em vez do worker. Use só o argumento esperado pelo entrypoint.
    command: ["minion"]

  analytic:
    build: ./analysis/edumapsr
    container_name: edumaps-analytic
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=db
      - EDUMAPS_R_PORT=8000
    # Pilha de 64 MB: o eduBR (escolas_similares) estoura os 8 MB padrão
    # dentro do Plumber (#219).
    ulimits:
      stack: 67108864
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: edumaps-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
      - analytic
