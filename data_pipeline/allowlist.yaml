sources_ref:
  - id: antta_monitriip
    name: "ANTT MONITRIIP - Serviço Regular"
    host: dados.antt.gov.br
    base_url: "https://dados.antt.gov.br"
    note: "Apenas recurso AGREGADO permitido; viagens negado acima"

  - id: sptrans
    name: "SPTRANS - Bilhete Único"
    host: dados.mobilidade.rio
    base_url: "https://dados.mobilidade.rio"
    note: "Recurso agregado de créditos permitido se existir; usuário NEGADO"

  - id: sus
    name: "Ministério da Saúde - Dados Abertos"
    host: dados.saude.gov.br
    base_url: "https://dados.saude.gov.br"
    note: "TODOS os endpoints de microdado individual NEGADOS"

# ------------------------------------------------------------
# FONTES PERMITIDAS — SAÚDE (agregados apenas, Fase 2)
# ------------------------------------------------------------
sources:
  - id: datasus_sisab
    name: "DATASUS/SISAB - Indicadores APS (agregados municipais)"
    host: apidadosabertos.saude.gov.br
    base_url: "https://apidadosabertos.saude.gov.br"
    resources:
      - path: "/atencao-primaria/pmmb-serie-historica"
        method: GET
        params: [codigo_municipio, limit, offset]
        description: "Série histórica PIM/AB por município (cobertura, equipes, IVS)"
        license: "CC BY 3.0 (dados abertos SUS)"
      - path: "/atencao-primaria/pmmb-consolidado"
        method: GET
        params: [codigo_municipio, limit, offset]
        description: "Consolidado PIM/AB atual (ativas_ff, equipe_esf, equipe_emsi, total_vagas_ativas, categoria_ivs)"
        license: "CC BY 3.0 (dados abertos SUS)"
      - path: "/macrorregiao-e-regiao-de-saude/municipio"
        method: GET
        params: [codigo_municipio, limit, offset]
        description: "Municípios com população estimada IBGE 2022 (denominador)"
        license: "CC BY 3.0 (dados abertos SUS)"

  - id: cnes_estabelecimentos
    name: "CNES - Estabelecimentos de saúde (sanitizado)"
    host: apidadosabertos.saude.gov.br
    base_url: "https://apidadosabertos.saude.gov.br"
    resources:
      - path: "/cnes/estabelecimentos"
        method: GET
        params: [codigo_uf, codigo_municipio, codigo_tipo_unidade, status, data_atualizacao, limit, offset]
        description: "Estabelecimentos com lat/long — SANITIZADO na ingestão (sem PII)"
        license: "CC BY-ND 3.0 (dados abertos SUS)"
      - path: "/cnes/tipounidades"
        method: GET
        params: [limit, offset]
        description: "Dicionário de tipos de unidade (UBS, SU, hospital, etc.)"
        license: "CC BY-ND 3.0 (dados abertos SUS)"

  - id: brazilcrime
    name: "BrazilCrime - Dados de criminalidade agregados por município"
    host: cran.r-project.org
    base_url: "https://cran.r-project.org/package=BrazilCrime"
    resources:
      - path: "/R/BrazilCrime"
        method: CRAN
        description: "Pacote R BrazilCrime - dados de criminalidade agregados por município/ano (homicídios, roubos, etc.)"
        license: "GPL-3 (CRAN)"

  - id: antt_acidentes
    name: "ANTT - Acidentes e geodados por trecho"
    host: dados.antt.gov.br
    base_url: "https://dados.antt.gov.br"
    resources:
      - path: "/dataset/acidentes"
        method: GET
        params: [limit, offset]
        description: "Acidentes em rodovias federais por trecho (Concessionaria;Data;Km;Trecho) — sem município, requer join com geodados ANTT"
        license: "CC-BY-4.0 (ANTT)"
      - path: "/dataset/trechos"
        method: GET
        params: [limit, offset]
        description: "Geodados de trechos rodoviários (Concessionaria;Trecho;Km_Inicial;Km_Final;Municipio) — permite resolver trecho → município"
        license: "CC-BY-4.0 (ANTT)"

  - id: transportes_renatest
    name: "Transportes - RENAEST sinistro (agregado por localidade)"
    host: dados.transportes.gov.br
    base_url: "https://dados.transportes.gov.br"
    resources:
      - path: "/dataset/renatest-sinistro"
        method: GET
        params: [limit, offset]
        description: "Sinistros RENAEST agregados por localidade (não município) — requer de-para localidade → município"
        license: "CC-BY-4.0 (Transportes)"

  - id: transportes_renavam
    name: "Transportes - RENAVAM frota agregada por município"
    host: dados.transportes.gov.br
    base_url: "https://dados.transportes.gov.br"
    resources:
      - path: "/dataset/frota-por-municipio"
        method: GET
        params: [limit, offset]
        description: "Frota agregada por município (não por veículo)"
        license: "CC-BY-4.0 (Transportes)"
      - path: "/dataset/renavam-frota"
        method: GET
        params: [limit, offset]
        description: "Frota de veículos por município e tipo"
        license: "CC-BY-4.0 (Transportes)"

  - id: osrm_valhalla
    name: "OSRM / Valhalla - Roteamento e isocronas auto-hospedados"
    host: localhost
    base_url: "http://localhost"
    resources:
      - path: "/route/v1"
        method: GET
        description: "OSRM auto-hospedado - rota e isocronas (tileset auto-hospedado)"
        license: "BSD-2-Clause (OSRM), MIT (Valhalla)"
      - path: "/isochrone"
        method: GET
        description: "Valhalla auto-hospedado - isocronas (tileset auto-hospedado)"
        license: "MIT (Valhalla)"

  - id: overpass_osm
    name: "Overpass API - OpenStreetMap POIs e rede viária"
    host: overpass-api.de
    base_url: "https://overpass-api.de/api/interpreter"
    resources:
      - path: "/"
        method: POST
        description: "Overpass QL query para POIs, vias, transporte público"
        license: "ODbL 1.0 (OpenStreetMap)"

  - id: inep
    name: "INEP - Censo Escolar, IDEB, ENEM, Painel PNE"
    host: download.inep.gov.br
    base_url: "https://download.inep.gov.br"
    resources:
      - path: "/microdados_censo_escolar_*.zip"
        method: GET
        description: "Microdados Censo Escolar (1995-2025) — aguardando e-SIC para licença"
        license: "Não verificada (e-SIC protocolado ______)"
      - path: "/microdados_ideb_*.zip"
        method: GET
        description: "Microdados IDEB/ENEM — aguardando e-SIC para licença"
        license: "Não verificada (e-SIC protocolado ______)"

  - id: mec_nicbr
    name: "MEC/NIC.br - Medidor Educação Conectada"
    host: educacaoconectada.mec.gov.br
    base_url: "https://educacaoconectada.mec.gov.br"
    resources:
      - path: "/download"
        method: GET
        description: "CSV + dicionário do Medidor Educação Conectada (mensal/trimestral)"
        license: "Não verificada (e-SIC protocolado ______)"

  - id: fnde
    name: "FNDE - PNATE, Novo PAC/Proinfância, PDDE"
    host: www.gov.br
    base_url: "https://www.gov.br/fnde/pt-br/acesso-a-informacao"
    resources:
      - path: "/dadosabertos/pnate"
        method: GET
        description: "PNATE mensal — URL + dicionário (e-SIC protocolado ______)"
        license: "Não verificada (e-SIC protocolado ______)"
      - path: "/dadosabertos/novo-pac"
        method: GET
        description: "Novo PAC/Proinfância — URL + dicionário (e-SIC protocolado ______)"
        license: "Não verificada (e-SIC protocolado ______)"
      - path: "/dadosabertos/pdde"
        method: GET
        description: "PDDE — URL + dicionário (e-SIC protocolado ______)"
        license: "Não verificada (e-SIC protocolado ______)"

  - id: secretarias_educacao
    name: "Secretarias Municipais de Educação - Transporte Escolar"
    host: variado
    base_url: "https://falabr.cgu.gov.br"
    resources:
      - path: "/e-sic"
        method: GET
        description: "Vagas de transporte escolar por unidade/turno (e-SIC municipal)"
        license: "Não verificada (e-SIC municipal protocolado ______)"

