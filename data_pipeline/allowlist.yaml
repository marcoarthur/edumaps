        description: "RREO (Relatório Resumido de Execução Orçamentária) por ente/exercício/bimestre"
        license: "Domínio público (Tesouro Nacional)"
      - path: "/ords/cdwhprd/siconfi/tt/dca"
        method: GET
        params: [an_exercicio, no_anexo, id_ente]
        description: "DCA (Declaração de Contas Anuais) por ente/exercício"
        license: "Domínio público (Tesouro Nacional)"
      - path: "/ords/cdwhprd/siconfi/tt/entes"
        method: GET
        description: "Cadastro de entes federativos com código IBGE"
        license: "Domínio público (Tesouro Nacional)"
    # Verificado 2026-10-13 (HEAD a partir de backend.edumaps): rreo, dca e entes → 200 application/json.

