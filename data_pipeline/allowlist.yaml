# Allowlist de endpoints/recursos para ingestão de dados
#
# Este arquivo define quais endpoints/recursos externos podem ser acessados
# pelos jobs de ingestão. Qualquer URL fora desta lista ABORTA o job.
#
# Estrutura:
# - sources: lista de fontes permitidas, cada uma com:
#     id: identificador único (usado no código)
#     name: nome legível
#     host: host base (ex.: www.fnde.gov.br)
#     resources: lista de recursos permitidos nesta fonte
#         path: caminho do endpoint (pode ter placeholders {cod_mun}, {ano})
#         method: HTTP method (GET, POST)
#         description: justificativa de por que este recurso é agregado
#         license: SPDX ou descrição da licença
# - denied: recursos EXPLICITAMENTE NEGADOS (mesmo host de permitido, mas recurso sensível)

sources:
  - id: fnde_siope_remuneracao
    name: "FNDE SIOPE - Remuneração Municipal (agregado)"
    host: www.fnde.gov.br
    base_url: "https://www.fnde.gov.br/siope/consultarRemuneracaoMunicipal.do"
    resources:
      - path: "/siope/consultarRemuneracaoMunicipal.do"
        method: GET
        params: [acao, cod_uf, municipios, anos, mes]
        description: "Planilha Excel agregada por município/cargo (não individual)"
        license: "Não verificada"
    # NOTA: O recurso de viagens/detalhado NÃO está listado → negado por omissão

  - id: ibge_sidra
    name: "IBGE SIDRA - APIs agregadas"
    host: apisidra.ibge.gov.br
    base_url: "https://apisidra.ibge.gov.br"
    resources:
      - path: "/values/t/1393/n1/all/v/all/p/all/c11255/all"
        method: GET
        description: "PIB municipal (tabela 1393) - agregado por município/ano"
        license: "Domínio público (IBGE)"
      - path: "/values/t/6579/n1/all/v/all/p/all/c11255/all"
        method: GET
        description: "População municipal - agregado por município/ano"
        license: "Domínio público (IBGE)"
    # NOTA: apisidra.ibge.gov.br está atrás de Cloudflare (403).
    # Usar SIDRA v3 em servicodados.ibge.gov.br para produção.

  - id: ibge_servicodados
    name: "IBGE Serviço de Dados - Malhas, códigos e SIDRA v3"
    host: servicodados.ibge.gov.br
    base_url: "https://servicodados.ibge.gov.br/api/v1"
    resources:
      - path: "/localidades/municipios"
        method: GET
        description: "Lista de municípios com códigos IBGE"
        license: "Domínio público (IBGE)"
      - path: "/localidades/municipios/{codigo_ibge}"
        method: GET
        description: "Detalhes de um município"
        license: "Domínio público (IBGE)"
      - path: "/localidades/setores/{codigo_ibge}"
        method: GET
        description: "Setores censitários de um município (simplificado)"
        license: "Domínio público (IBGE)"
      - path: "/sidra/v3/values/t/1393/n1/all/v/all/p/all/c11255/all"
        method: GET
        description: "SIDRA v3 - PIB municipal (sem Cloudflare)"
        license: "Domínio público (IBGE)"
      - path: "/sidra/v3/values/t/6579/n1/all/v/all/p/all/c11255/all"
        method: GET
        description: "SIDRA v3 - População municipal"
        license: "Domínio público (IBGE)"
      - path: "/sidra/v3/values/t/1093/n1/all/v/all/p/all/c11255/all"
        method: GET
        description: "SIDRA v3 - IDHM municipal"
        license: "Domínio público (IBGE)"
      - path: "/sidra/v3/values/t/5938/n1/all/v/all/p/all/c11255/all"
        method: GET
        description: "SIDRA v3 - PIB per capita"
        license: "Domínio público (IBGE)"

  - id: inmet
    name: "INMET - Dados meteorológicos e alertas"
    host: dados.inmet.gov.br
    base_url: "https://dados.inmet.gov.br"
    resources:
      - path: "/dados/{tipo}/{ano}/{mes}"
        method: GET
        description: "Estações automáticas/conceição - dados agregados por estação/dia"
        license: "CC-BY-4.0 (INMET)"
      - path: "/alertas/cap12"
        method: GET
        params: [data_ini, data_fim, uf]
        description: "Alerta-AS (CAP 1.2) - eventos meteorológicos que interrompem aula, com código IBGE"
        license: "CC-BY-4.0 (INMET)"
      - path: "/bdmep/estacao"
        method: GET
        params: [estacao, data_ini, data_fim]
        description: "BDMEP - série diária histórica de estações (26 anos), sem autenticação"
        license: "CC-BY-4.0 (INMET)"

  - id: mapbiomas
    name: "MapBiomas - Cobertura/uso do solo e fogo"
    host: mapbiomas.org
    base_url: "https://mapbiomas.org"
    resources:
      - path: "/download/collection/{colecao}/municipios"
        method: GET
        description: "Mosaico municipal por COLEÇÃO (não por ano). Fixar coleção (ex.: collection9)"
        license: "CC-BY-4.0 (MapBiomas)"
      - path: "/download/collection/{colecao}/fogo"
        method: GET
        description: "MapBiomas Fogo por coleção (substitui INPE Queimadas)"
        license: "CC-BY-4.0 (MapBiomas)"

  - id: transportes_renavam
    name: "Ministério dos Transportes - RENAVAM/RENAEST (frota agregada)"
    host: dados.transportes.gov.br
    base_url: "https://dados.transportes.gov.br"
    resources:
      - path: "/dataset/frota-por-municipio"
        method: GET
        description: "Frota agregada por município (não por veículo)"
        license: "CC-BY-4.0 (Transportes)"

  - id: ibge_geoftp
    name: "IBGE Geoftp - Malhas territoriais (GPKG)"
    host: geoftp.ibge.gov.br
    base_url: "https://geoftp.ibge.gov.br"
    resources:
      - path: "/organizacao_do_territorio/malhas_territoriais/malhas_municipais/municipio_2024/Brasil/BR_Municipios_2024.zip"
        method: GET
        description: "Malha municipal 2024 (shapefile, usado em raw_municipios_sp)"
        license: "Domínio público (IBGE)"
      - path: "/organizacao_do_territorio/malhas_territoriais/malhas_municipais/municipio_2024/Brasil/BR_Municipios_2024.gpkg"
        method: GET
        description: "Malha municipal 2024 (GPKG, GeoPackage)"
        license: "Domínio público (IBGE)"
      - path: "/organizacao_do_territorio/malhas_territoriais/malha_setores_censitarios/setor_censitario_2022/Brasil/BR_Setor_Censitario_2022.gpkg"
        method: GET
        description: "Malha de setor censitário 2022 (GPKG, ~748 MB)"
        license: "Domínio público (IBGE)"

  - id: tesouror_siconfi
    name: "Tesouro Nacional / SICONFI - Finanças municipais"
    host: tesouror.transparencia.gov.br
    base_url: "https://tesouror.transparencia.gov.br"
    resources:
      - path: "/api/v1/receitas"
        method: GET
        params: [exercicio, id_ente, tipo_receita]
        description: "Receitas municipais (próprias, transferências, FUNDEB) por exercício e ente"
        license: "Domínio público (Tesouro Nacional)"
      - path: "/api/v1/despesas"
        method: GET
        params: [exercicio, id_ente, funcao, subfuncao]
        description: "Despesas municipais por função/subfunção (educação, saúde, etc.)"
        license: "Domínio público (Tesouro Nacional)"
      - path: "/api/v1/entes"
        method: GET
        params: [codigo_ibge]
        description: "Cadastro de entes federativos com código IBGE"
        license: "Domínio público (Tesouro Nacional)"

  - id: cgu_transparencia
    name: "CGU Portal da Transparência - Transferências da União"
    host: api.portaldatransparencia.gov.br
    base_url: "https://api.portaldatransparencia.gov.br"
    resources:
      - path: "/api-de-dados/transferencias"
        method: GET
        params: [codigo_ibge, data_inicio, data_fim, pagina]
        description: "Transferências da União para estados/municípios (FUNDEB, PNATE, etc.)"
        license: "CC-BY-4.0 (CGU)"
      - path: "/api-de-dados/entes"
        method: GET
        params: [codigo_ibge]
        description: "Cadastro de entes federativos"
        license: "CC-BY-4.0 (CGU)"

# ------------------------------------------------------------
# RECURSOS EXPLICITAMENTE NEGADOS (mesmo host de permitido)
# ------------------------------------------------------------
denied:
  - id: antta_monitriip_viagens
    source_ref: antta_monitriip
    host: dados.antt.gov.br
    path: "/dataset/monitriip-viagens"
    reason: "74 recursos, CC-BY, mas expõe CNPJ, placa, IMEI, lat/long POR VIAGEM — nível individual, LGPD"

  - id: sptrans_bilhete_unico_usuario
    source_ref: sptrans
    host: dados.mobilidade.rio
    path: "/dataset/creditos-eletronicos-bilhete-unico-usuario"
    reason: "CCZero, mas nível INDIVIDUAL (saldo por usuário) — cruzado com escola/horário reconstrói trajeto de aluno"

  - id: sus_sisvan_individual
    source_ref: sus
    host: dados.saude.gov.br
    path: "/sisvan/estado-nutricional"
    reason: "Microdado individual (peso, altura, IMC por pessoa) — menor de idade"

  - id: sus_vacinacao_individual
    source_ref: sus
    host: dados.saude.gov.br
    path: "/vacinacao/doses-aplicadas-pni-*"
    reason: "Microdado individual (data vacinação, código documento, raça por pessoa)"

  - id: sus_cnes_individual
    source_ref: sus
    host: dados.saude.gov.br
    path: "/cnes/estabelecimentos"
    reason: "Expõe CNPJ, telefone, e-mail, nome de pessoa física de estabelecimentos"

