# Allowlist de endpoints/recursos para ingestão de dados
#
# Este arquivo define quais endpoints/recursos externos podem ser acessados
# pelos jobs de ingestão. Qualquer URL fora desta lista ABORTA o job.
#
# Estrutura:
# - sources: lista de fontes permitidas, cada uma com:
#     id: identificador único (usado no código) — NÃO pode repetir
#     name: nome legível
#     host: host base (ex.: www.fnde.gov.br)
#     status: (opcional) "ativo" (padrão) ou "inativo". Fonte inativa fica
#             registrada como histórico, mas o validador REJEITA as URLs dela
#             (host morto, API retirada). Anotar o motivo em `status_note`.
#     resources: lista de recursos permitidos nesta fonte
#         path: caminho do endpoint (pode ter placeholders {cod_mun}, {ano}
#               — um segmento — e curinga "*" — qualquer trecho sem "/");
#               casa por prefixo de segmento (path exato ou path + "/...")
#         method: HTTP method (GET, POST)
#         description: justificativa de por que este recurso é agregado
#         license: SPDX ou descrição da licença
# - denied: recursos EXPLICITAMENTE NEGADOS (mesmo host de permitido, mas recurso sensível);
#     `path` casa por PREFIXO (aceita o curinga "*"); têm precedência sobre `sources`
# - sources_ref: fontes citadas em `denied`, só para contexto (não liberam nada)
#
# REGRA (issue #230): cada chave de topo (`sources`, `denied`, `sources_ref`)
# aparece UMA ÚNICA VEZ. O YAML::XS não acusa chave duplicada e fica com a
# última ocorrência — foi assim que 8 fontes e todas as regras de `denied`
# ficaram inertes. Para acrescentar fontes, edite a lista existente; não abra
# um segundo bloco `sources:`. O EduMaps::Data::Allowlist recusa carregar
# (die) um arquivo com chave de topo duplicada, lista inválida ou id repetido,
# e o teste t/02-models/allowlist_real.t roda sobre ESTE arquivo.

