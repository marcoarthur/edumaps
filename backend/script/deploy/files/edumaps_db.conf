{
  db_opts => {
    RaiseError          => 1,
    PrintError          => 0,
    AutoCommit          => 1,

    # PostgreSQL-specific optimizations
    pg_server_prepare   => 1,          # ✅ Significant performance boost
    pg_enable_utf8      => 1,          # ✅ Essential for Unicode
    pg_bytea            => 'escape',   # Binary data handling

    # Debugging and development
    ShowErrorStatement  => 1,          # See failing SQL in errors
    TraceLevel          => 0,          # Set to 1-4 for debugging

    # Connection management
    pg_connect_timeout  => 10,
    pg_keepalive        => 1,          # Enable TCP keepalive

    # Application identification
    pg_appname          => 'edumaps_dev',  # Shows in pg_stat_activity
  },
  db_params => [
    'dbi:Pg:dbname=edumaps_dev;host=Database',
    '<%=$db_user%>',
    '<%=$db_pass%>',
  ],
  db_url => 'postgresql://<%=$db_user%>:<%=$db_pass%>@Database/edumaps_dev',

  # Serviço analítico (edumapsr/Plumber) e motor das tasks de análise R.
  # No ambiente deployado as análises rodam no container analytic (o backend
  # não tem as deps R). analytics_engine: 'http' (Plumber via
  # EduMaps::Analytics::Client) ou 'pipe' (legado R::Pipe — só p/ dev local).
  analytics_url            => 'http://analytic:8000',
  analytics_timeout        => 300,
  analytics_source_version => 'edumapsr-0.1.0',
  analytics_cache_enabled  => 1,
  analytics_engine         => 'http',
};
