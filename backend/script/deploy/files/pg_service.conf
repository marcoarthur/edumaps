[edumaps]
host=Database
port=5432
user=<%= $db_user %>
dbname=<%= $db_name %>
password=<%= $db_pass %>

# Serviço usado pelas análises R (edumapsr) e pelos jobs legados R::Pipe
# (EduMaps::Task::*: apply_*_analytics buscam service = 'edumaps_local').
[edumaps_local]
host=Database
port=5432
user=<%= $db_user %>
dbname=<%= $db_name %>
password=<%= $db_pass %>

# Serviço SOMENTE-LEITURA do assistente NL/SQL do censo (/ask, edumapsr).
# A role edumaps_leitor (sqitch edumaps_leitor_role) tem SELECT em
# clean/analytics + default_transaction_read_only=on — o SQL gerado por LLM
# nunca consegue escrever. LOGIN/senha ativados no deploy (deploy_db_dev).
[edumaps_leitor]
host=Database
port=5432
user=edumaps_leitor
dbname=<%= $db_name %>
password=<%= $db_pass %>