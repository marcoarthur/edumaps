server {
    listen 80 default_server;
    server_name <%= $server_name %>;

    # Upload de documentos do gestor (200 KB padrão seria insuficiente)
    client_max_body_size 12m;

    # Compressão dos arquivos estáticos. O `gzip on` padrão só comprime
    # text/html: sem `gzip_types`, o bundle index-*.js (~1 MB, novo a cada
    # deploy) saía cru e levava ~10 s na primeira carga pós-deploy (tela em
    # branco). Ver docs/e2e/cobertura.md, rodada 2026-11-01 (d).
    # Sem `gzip_proxied`: as respostas da API (inclusive SSE do chat e das
    # tasks) continuam como estão; gzip retém o buffer e quebraria o stream.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript
               application/json application/manifest+json image/svg+xml;

    root <%= $web_root %>;
    index index.html;

    # Logs (opcional)
    access_log /var/log/nginx/edumaps-frontend-access.log;
    error_log  /var/log/nginx/edumaps-frontend-error.log;

    # Proxy para API do backend (Mojolicious)
    location /api/ {
        proxy_pass <%= $backend_api %>/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # O motor R (Plumber) NÃO é publicado pelo nginx: só o backend fala com
    # ele (analytics_url). A SPA não o chama.

    # Para arquivos estáticos (JS, CSS, imagens) – tentativa direta
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA: manifest precisa de MIME correto (senão o browser não parseia).
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        expires 1h;
    }

    # Service worker não deve ser cacheado (senão fica preso numa versão).
    location = /sw.js {
        types { } default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: todas as outras rotas vão para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML de entrada nunca deve ser cacheado (senão o browser segura um
    # bundle antigo após um novo build).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
