server {
    listen 80 default_server;
    server_name <%= $server_name %>;

    # Upload de documentos do gestor (200 KB padrão seria insuficiente)
    client_max_body_size 12m;

    root <%= $web_root %>;
    index index.html;

    # Logs (opcional)
    access_log /var/log/nginx/edumaps-frontend-access.log;
    error_log  /var/log/nginx/edumaps-frontend-error.log;

    # Proxy para API do backend (Mojolicious)
    location /api/ {
        proxy_pass <%= $backend_api %>/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para a API analítica (R plumber)
    location /analytic-api/ {
        # Remove o prefixo /analytic-api antes de passar ao backend
        rewrite ^/analytic-api(/.*)$ $1 break;
        proxy_pass <%= $analytic_api %>;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Para arquivos estáticos (JS, CSS, imagens) – tentativa direta
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA: manifest precisa de MIME correto (senão o browser não parseia).
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        expires 1h;
    }

    # Service worker não deve ser cacheado (senão fica preso numa versão).
    location = /sw.js {
        types { } default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: todas as outras rotas vão para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML de entrada nunca deve ser cacheado (senão o browser segura um
    # bundle antigo após um novo build).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
