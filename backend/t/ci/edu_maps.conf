use strict;
use warnings;

# `EduMaps::Schema->go` faz `do $conf_file` e usa o valor da última
# expressão. Por isso o arquivo termina em `\%conf` e não é um `{ ... }`
# solto: com `my` antes da primeira chave, o Perl trata a chave de abertura
# como bloco e devolve só o último par.
my $host = $ENV{EDUMAPS_DB_HOST}
  or die "EDUMAPS_DB_HOST nao definido (obrigatorio no CI)\n";
my $name = $ENV{EDUMAPS_DB_NAME}
  or die "EDUMAPS_DB_NAME nao definido (obrigatorio no CI)\n";
my $user = $ENV{EDUMAPS_DB_USER}
  or die "EDUMAPS_DB_USER nao definido (obrigatorio no CI)\n";
my $pass = $ENV{EDUMAPS_DB_PASS}
  or die "EDUMAPS_DB_PASS nao definido (obrigatorio no CI)\n";
my $port = $ENV{EDUMAPS_DB_PORT} // 5432;

my %conf = (
  db_opts => {
    RaiseError          => 1,
    PrintError          => 0,
    AutoCommit          => 1,
    pg_server_prepare   => 1,
    pg_enable_utf8      => 1,
    pg_bytea            => 'hex',
    ShowErrorStatement  => 1,
    TraceLevel          => 0,
    pg_connect_timeout  => 10,
    pg_keepalive        => 1,
    pg_appname          => 'edumaps_ci',
  },

  db_params => [
    "dbi:Pg:dbname=$name;host=$host;port=$port",
    $user,
    $pass,
  ],

  db_url => "postgresql://$user:$pass\@$host:$port/$name",

  # O servico analitico (edumapsr/Plumber) nao sobe no CI: os testes que
  # dependem dele se auto-semeiam um daemon falso em loopback, ou sao pulados
  # (ver t/lib/CI.pm).
  analytics_url            => $ENV{ANALYTICS_URL} // 'http://127.0.0.1:8787',
  analytics_timeout        => 30,
  analytics_source_version => 'edumapsr-0.1.0',
  analytics_cache_enabled  => 1,
  analytics_engine         => 'http',

  upload_dir => './var/uploads',

  admin => {
    email => 'admin@edumaps.local',
    senha => 'e2eadmin123',
  },
);

\%conf;
