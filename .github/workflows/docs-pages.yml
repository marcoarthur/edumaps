# Publica docs/ajuda/ no GitHub Pages via GitHub Actions
name: Deploy docs/ajuda to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/ajuda/**"
      - ".github/workflows/docs-pages.yml"
      - "tools/help-wiki/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: |
          mkdir -p _site
          # Copia todo o conteúdo de docs/ajuda
          cp -r docs/ajuda/* _site/ 2>/dev/null || true
          # Se não tiver index.html, cria a partir do README.md
          if [ ! -f _site/index.html ]; then
            python3 -m pip install -q markdown 2>/dev/null || true
            python3 << 'PYEOF'
import markdown, os, pathlib

base = pathlib.Path('_site')
readme = base / 'README.md'
if readme.exists():
    md = readme.read_text(encoding='utf-8')
    html = markdown.markdown(md, extensions=['extra','toc','fenced_code','tables'])
    out = f'''<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ajuda EduMaps</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
</head>
<body>
  <main>
    <p><a href="https://github.com/marcoarthur/edumaps">← Voltar ao repositório</a></p>
    {html}
  </main>
</body>
</html>'''
    (base / 'index.html').write_text(out, encoding='utf-8')
else:
    # fallback simples
    (base / 'index.html').write_text('<!doctype html><meta charset=utf-8><title>Ajuda EduMaps</title><p>Ver <a href="README.md">README.md</a></p>', encoding='utf-8')
PYEOF
          fi
          # Copia também o glossário e template como referência
          cp docs/ajuda/_glossario.md _site/ 2>/dev/null || true
          cp docs/ajuda/_template.md _site/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
