name: Deploy docs/ajuda to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/ajuda/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install deps
        run: pip install markdown

      - name: Build site
        run: |
          mkdir -p _site
          cp -r docs/ajuda/* _site/
          python3 << 'PYEOF'
import markdown, pathlib
base = pathlib.Path('_site')
readme = base / 'README.md'
if readme.exists():
    md = readme.read_text(encoding='utf-8')
    html = markdown.markdown(md, extensions=['extra','toc','fenced_code','tables'])
    (base / 'index.html').write_text(f'''<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajuda EduMaps</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
</head><body><main><p><a href="https://github.com/marcoarthur/edumaps">← Repositório</a></p>{html}</main></body></html>''', encoding='utf-8')
PYEOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
