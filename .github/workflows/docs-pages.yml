name: Deploy docs/ajuda to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/ajuda/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install deps
        run: pip install markdown

      - name: Build site
        run: |
          mkdir -p _site
          cp -r docs/ajuda/* _site/
          python3 -c "import markdown,pathlib; base=pathlib.Path('_site'); r=base/'README.md'; html=markdown.markdown(r.read_text(encoding='utf-8'),extensions=['extra','toc','fenced_code','tables']) if r.exists() else '<p>Ajuda EduMaps</p>'; (base/'index.html').write_text('<!doctype html><html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Ajuda EduMaps</title><link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/water.css@2/out/water.css\"></head><body><main><p><a href=\"https://github.com/marcoarthur/edumaps\">\u2190 Reposit\u00f3rio</a></p>'+html+'</main></body></html>',encoding='utf-8')"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
