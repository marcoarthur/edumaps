name: Deploy docs/ajuda to GitHub Pages

on:
  pull_request:
    paths:
      - "docs/ajuda/**"
      - "docs/funcionalidades/**"
      - ".github/workflows/docs-pages.yml"
      - "tools/help-wiki/**"
  push:
    branches: ["main"]
    paths:
      - "docs/ajuda/**"
      - "docs/funcionalidades/**"
      - ".github/workflows/docs-pages.yml"
      - "tools/help-wiki/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: pip install markdown pyyaml

      # Front-matter, links quebrados e status parcial sem limitações
      - name: Validate
        run: python3 tools/help-wiki/export.py

      - name: Build site
        run: python3 tools/help-wiki/build_pages.py

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
