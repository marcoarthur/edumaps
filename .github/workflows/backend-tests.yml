# Suíte de testes do backend Perl contra um banco Postgres/PostGIS criado do
# zero com os fixtures de db/fixtures/.
#
# O que o job faz:
#   1. Restaura a imagem do banco do cache (actions/cache, key = hash do
#      db/Dockerfile) e sobe o banco de CI com o espelho HTTPS local
#      (db/fixtures/ci_db.sh up): imagem de db/Dockerfile, rede, sqitch deploy
#      das 60+ migrations. O cache existe porque o Docker Hub regula o acesso
#      anónimo por IP (429 Too Many Requests sustenta nos runners partilhados);
#      só reconstrói quando o Dockerfile muda.
#   2. Roda o gate das migrations (db/fixtures/ci_db.sh verify): cada change
#      roda o seu verify/*.sql e uma falha derruba o job (issue #160).
#   3. Instala as dependências do backend (cpanfile: `apt` + `cpanm`) no runner.
#   4. Roda `prove -r -l t/` com EDUMAPS_FIXTURES=1 — os testes que dependem de
#      R, de serviços externos ou do schema staging se auto-pulam
#      (t/lib/CI.pm).
#
# O CI não depende do dataset real (765 MB): o fixture traz 18 municípios e as
# escolas exigidas pelos testes. Para reproduzir localmente o mesmo banco,
# rodar `db/fixtures/ci_db.sh up` e ver a lista de variáveis que ele imprime.
#
# Para eliminar de vez o 429 (em vez de só mitigar com cache), criar os
# secrets DOCKERHUB_USERNAME e DOCKERHUB_TOKEN (token read-only de uma conta
# gratuita do Docker Hub): o passo de login passa a autenticar os pulls.

name: backend-tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'backend/**'
      - 'data_pipeline/**'
      - 'db/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Perl contra o banco de fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Mesmas variáveis que o deploy do Rex injeta no container de dev —
      # lidas por backend/t/ci/edu_maps.conf.
      EDUMAPS_CONF: ./t/ci/edu_maps.conf
      EDUMAPS_DB_HOST: 127.0.0.1
      EDUMAPS_DB_PORT: '55432'
      EDUMAPS_DB_NAME: edumaps_ci
      EDUMAPS_DB_USER: ci
      EDUMAPS_DB_PASS: ci
      # Liga as guardas de skip em t/lib/CI.pm: os testes que exigem R,
      # rede ou o schema staging se auto-pulam em vez de falhar.
      EDUMAPS_FIXTURES: '1'

    steps:
      - uses: actions/checkout@v4

      - name: dependências de sistema (cabeçalhos do libpq, cpanminus)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev cpanminus

      - name: cache da imagem do banco (edumaps-db:ci)
        uses: actions/cache@v4
        with:
          path: /tmp/edumaps-ci-image/edumaps-db-ci.tar.gz
          key: edumaps-db-ci-${{ hashFiles('db/Dockerfile') }}

      # Opcional: com DOCKERHUB_USERNAME/DOCKERHUB_TOKEN configurados, os pulls
      # passam a ser autenticados e o 429 do Docker Hub desaparece por completo
      # (ver o cabeçalho deste arquivo). Sem os secrets o passo é pulado.
      - name: login no Docker Hub (opcional)
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: sobe o banco de CI (imagem, espelho, sqitch deploy)
        run: db/fixtures/ci_db.sh up
        env:
          EDUMAPS_CI_PORT: '55432'
          EDUMAPS_CI_IMAGE_TARBALL_IN: /tmp/edumaps-ci-image/edumaps-db-ci.tar.gz
          EDUMAPS_CI_IMAGE_TARBALL_OUT: /tmp/edumaps-ci-image/edumaps-db-ci.tar.gz

      - name: gate das migrations (sqitch verify)
        run: db/fixtures/ci_db.sh verify
        env:
          EDUMAPS_CI_PORT: '55432'

      - name: diagnóstico (espelho + banco) se o deploy falhar
        if: failure()
        run: |
          docker logs edumaps-ci-db | tail -40
          docker logs edumaps-ci-mirror | tail -40

      - name: dependências do backend (cpanfile)
        run: sudo cpanm --notest --installdeps .
        working-directory: backend

      - name: compilar todos os módulos Perl (lib/)
        working-directory: backend
        run: |
          set -e
          find lib -name '*.pm' -print0 | xargs -0 -n1 perl -Ilib -c >/dev/null

      - name: inventário de dependências (use/require vs cpanfile)
        working-directory: backend
        run: perl -Ilib script/check_dependencies.pl

      - name: suíte de testes
        working-directory: backend
        run: prove -r -l t/